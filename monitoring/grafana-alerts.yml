apiVersion: 1
groups:
    - orgId: 1
      name: InfraReady
      folder: InfraReady
      interval: 1m
      rules:
        - uid: bg1t2bgxz7y80c
          title: InfraReady - Machine indisponible
          condition: C
          data:
            - refId: A
              relativeTimeRange:
                from: 600
                to: 0
              datasourceUid: bg1sv27gni4u8d
              model:
                editorMode: code
                expr: up
                instant: true
                intervalMs: 1000
                legendFormat: __auto
                maxDataPoints: 43200
                range: false
                refId: A
            - refId: C
              queryType: expression
              datasourceUid: __expr__
              model:
                conditions:
                    - evaluator:
                        params:
                            - 1
                        type: lt
                      operator:
                        type: and
                      query:
                        params:
                            - C
                      reducer:
                        params: []
                        type: last
                      type: query
                datasource:
                    type: __expr__
                    uid: __expr__
                expression: A
                intervalMs: 1000
                maxDataPoints: 43200
                refId: C
                type: threshold
          noDataState: NoData
          execErrState: Error
          for: 1m
          annotations:
            description: La métrique Prometheus up est inférieure à 1 depuis au moins une minute. Vérifier la connectivité réseau et l'état de l'exporter concerné.
            summary: Une cible InfraReady est indisponible.
          labels: {}
          isPaused: false
          notification_settings:
            receiver: InfraReady - Email Alerts
